<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=block">
</head><body>
<script src="../web/textures.js"></script>
<script>
// Paints every texture the iOS app uses and exposes them as PNG data URLs for tools/bake-textures.py.
// The face layout must match the machine dimensions in GachaController.swift and web/index.html.
const LAYOUT = { LW: 2.22, LH: 2.28, LY: 1.27, KNOB_Y: 1.62, EXIT_Y: 0.6, EXIT_W: 0.8, EXIT_H: 0.66 };
Promise.all([500, 700, 900].map((w) => document.fonts.load(`${w} 40px "Zen Maru Gothic"`))).finally(() => {
  const T = GotchaTextures, out = {};
  for (const v of T.CARDS) out[`card-${v}`] = T.make("card", v).toDataURL("image/png");
  out.face = T.make("face", LAYOUT).toDataURL("image/png");
  for (const k of ["badge", "flap", "grain", "floor", "wall", "env", "ao"]) out[k] = T.make(k).toDataURL("image/png");
  window.BAKED = out;
});
</script></body></html>
